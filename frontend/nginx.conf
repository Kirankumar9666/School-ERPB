# nginx config for the containerized School ERP web app:
# serves the Vite production bundle, falls back to index.html for
# client-side routes (react-router), and proxies /api to the backend
# service on the compose network (same origin → no CORS needed).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip — the alpine nginx image ships with compression OFF; without this
    # the JS/CSS/JSON payload reaches the client uncompressed. (API responses
    # are compressed by the Express `compression` middleware, not here.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    # Hashed Vite assets — cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html — must never be cached hard: it references the hashed asset
    # filenames, so a stale copy breaks the app after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API proxy → backend service (compose network name)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Liveness through the public origin (the app's health route is NOT under
    # /api, so without this an external uptime monitor only ever sees the SPA's
    # index.html and every check "succeeds" even when the API is down).
    # Also reachable for `npm run smoke:staging -- --base-url https://<host>/api/v1`
    # (that run derives the origin and probes /health there).
    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # SPA fallback — let react-router own every non-file route
    location / {
        try_files $uri /index.html;
    }
}