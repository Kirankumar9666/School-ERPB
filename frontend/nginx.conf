# nginx config for the containerized School ERP web app:
# serves the Vite production bundle, falls back to index.html for
# client-side routes (react-router), and proxies /api to the backend
# service on the compose network (same origin → no CORS needed).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy → backend service (compose network name)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — let react-router own every non-file route
    location / {
        try_files $uri /index.html;
    }
}