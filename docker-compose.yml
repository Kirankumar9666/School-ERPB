# School ERP portal — deployment stack (laptop / staging / production).
#
# Usage:
#   cp .env.docker.example .env.docker    # then fill in the real secrets
#   docker compose --env-file .env.docker up --build
#
# The web app is served by nginx on FRONTEND_PORT (default 8080) and proxies
# /api to the backend service — same origin, so no CORS is involved.
#
# The bundled `postgres` service below is only used when DATABASE_URL points at
# it (the local/self-hosted case). On staging/production DATABASE_URL points at
# Supabase instead, and the API is started with:
#   docker compose --env-file .env.docker up -d --no-deps --build backend frontend
# Migrations never run from these containers — see DEPLOYMENT.md §3.2.

name: school-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-schoolerp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-schoolerp} -d ${POSTGRES_DB:-schoolerp}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host — reach it via `docker compose exec postgres psql`.
    # Uncomment to inspect from the host:
    # ports:
    #   - '5432:5432'

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Production fail-fast: the API refuses to start without real secrets
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.docker}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env.docker}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Database — required, and the one value that differs per environment:
      #   local stack  -> postgres://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_DB>
      #   staging/prod -> Supabase TRANSACTION pooler (port 6543) with
      #                   ?pgbouncer=true&connection_limit=10&pool_timeout=20
      # (Migrations are NOT run by this container — the production image ships
      #  without the Prisma CLI. Release step: `npm run prisma:deploy` from a
      #  trusted machine/CI with DIRECT_URL pointed at the session pooler.)
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.docker (see .env.docker.example)}
      # Request logging: prod default 'warn' = no per-request logs (LOG_LEVEL=debug
      # turns on morgan 'combined' for temporary diagnosis only).
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      # Global /api/v1 ceiling per client IP — raise for a whole school behind
      # one NAT IP or for load tests.
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host — nginx proxies /api. Uncomment to debug:
    # ports:
    #   - '5000:5000'

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; nginx proxies /api → backend
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  pgdata: